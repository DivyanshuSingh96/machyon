# Machyon documentation (Zensical). Build: zensical build   Preview: zensical serve
# Before a release, tools/check_docs.py --release checks the built site and that no placeholder is left anywhere.

[project]
site_name = "Machyon"
site_description = "Fast asynchronous image downloads for Python, with adaptive concurrency and reliability built in."
site_author = "Divyanshu Singh"
site_url = "https://divyanshusingh96.github.io/machyon/"
repo_url = "https://github.com/DivyanshuSingh96/machyon"
repo_name = "machyon"
edit_uri = "edit/main/docs/"
copyright = "MIT licence · © 2026 Divyanshu Singh · Opa and the Machyon wordmark are the project's brand"
docs_dir = "docs"
strict = true
exclude_docs = """
overrides/
_snippets/
"""

extra_css = ["assets/css/machyon.css"]
extra_javascript = ["assets/js/engine-sim.js", "assets/js/opa-404.js", "assets/js/lab/recording.js", "assets/js/lab/adaptive-lab.js"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/choosing-an-interface.md",
    "getting-started/amazon-ml-challenge.md",
  ] },
  { "Guides" = [
    "guides/input-sources.md",
    "guides/naming.md",
    "guides/configuration.md",
    "guides/async-apps.md",
    "guides/large-runs.md",
  ] },
  { "Reliability" = [
    "reliability/index.md",
    "reliability/zero-lost.md",
    "reliability/retries-and-rate-limits.md",
    "reliability/image-validation.md",
    "reliability/resuming.md",
    "reliability/failure-ledger.md",
  ] },
  { "Performance" = [
    "performance/adaptive-concurrency.md",
    "performance/benchmarks.md",
  ] },
  { "Cookbook" = [
    "cookbook/index.md",
    "cookbook/first-dataset.md",
  ] },
  { "Interactive Lab" = [
    "lab/index.md",
    "lab/adaptive-concurrency.md",
  ] },
  { "Reference" = [
    "reference/python-api.md",
    "reference/configuration.md",
    "reference/cli.md",
    "reference/failure-reasons.md",
  ] },
  { "Troubleshooting" = "troubleshooting/index.md" },
  { "Architecture" = "ARCHITECTURE.md" },
  { "Project" = [
    "project/meet-opa.md",
    "project/responsible-use.md",
    "project/changelog.md",
    "project/contributing.md",
    "project/documentation.md",
    "project/license.md",
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
language = "en"
logo = "assets/brand/machyon-lockup-light.svg"     # swapped for -dark on slate by machyon.css
favicon = "assets/brand/favicon.ico"           # favicon.svg and apple-touch-icon are added in overrides/main.html
font = false            # self-hosted fonts (assets/fonts), no third-party requests
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
repo = "https://github.com/DivyanshuSingh96/machyon"           # used inside pages
pypi = "https://pypi.org/project/machyon/"
film = "assets/film/the-arrival-of-opa.mp4"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/DivyanshuSingh96/machyon"
name = "Machyon on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/machyon/"
name = "Machyon on PyPI"

# ---------------------------------------------------------------- plugins

[project.plugins.search]

[project.plugins.macros]
module_name = "tools/docs_macros"
on_undefined = "strict"

[project.plugins.llmstxt]
markdown_description = """
Machyon is a Python library and CLI that downloads any number of images from URL lists (CSV, TSV, TXT, JSON,
JSONL, Parquet, DataFrames, iterables). It tunes its own concurrency, retries and honours rate limits, validates
that every body is a real image, writes files atomically, resumes by re-running, and records every failure
with a reason in failed_downloads.jsonl. Python 3.11+. Install: pip install machyon.
"""
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Cookbook" = ["cookbook/index.md", "cookbook/first-dataset.md"]
"Get started" = ["getting-started/quickstart.md", "getting-started/amazon-ml-challenge.md", "getting-started/installation.md", "getting-started/choosing-an-interface.md"]
"Guides" = ["guides/input-sources.md", "guides/naming.md", "guides/configuration.md", "guides/async-apps.md", "guides/large-runs.md"]
"Reliability" = ["reliability/zero-lost.md", "reliability/index.md", "reliability/retries-and-rate-limits.md", "reliability/image-validation.md", "reliability/resuming.md", "reliability/failure-ledger.md"]
"Reference" = ["reference/python-api.md", "reference/configuration.md", "reference/cli.md", "reference/failure-reasons.md", "troubleshooting/index.md"]
"Design" = ["ARCHITECTURE.md", "performance/adaptive-concurrency.md", "performance/benchmarks.md", "lab/index.md", "lab/adaptive-concurrency.md"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
extensions = [{ "tools/griffe_machyon.py:MachyonDocs" = {} }]
show_source = false
members_order = "source"
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
docstring_section_style = "list"
heading_level = 2
filters = ["!^_"]

# ---------------------------------------------------------------- markdown

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Link to this section"
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["docs/_snippets", "."]
pymdownx.snippets.check_paths = true
# No mermaid fence on purpose: the theme would fetch ~5 MB of mermaid from unpkg.com at runtime. Diagrams are
# inline SVG/HTML instead, so the site makes no third-party requests.
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
