# Weekly pull requests that keep the workflow actions and the docs toolchain up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
