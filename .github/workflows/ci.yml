name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: with uvloop/winloop
        if: matrix.os != 'windows-latest' || matrix.python != '3.15'
        run: |
          python -m pip install -e ".[fast]" || echo "fast extras unavailable on this Python yet"
          python -m pytest -q tests/test_api.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests tools
      - name: The UI's script parses
        run: node --check src/machyon/ui/static/app.js && node --check src/machyon/ui/static/theme.js

  # The wheel and the sdist, installed the way users get them, must serve every file `machyon ui` needs.
  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -U pip build
      - run: python -m build --outdir dist
      - name: Install the wheel in a clean environment and run machyon ui
        shell: bash
        run: |
          python -m venv /tmp/wheel-env
          PY=/tmp/wheel-env/bin/python; [ -x "$PY" ] || PY=/tmp/wheel-env/Scripts/python.exe
          "$PY" -m pip install dist/*.whl
          python tools/smoke_ui.py "$PY"
      - name: Install the sdist in a clean environment and run machyon ui
        shell: bash
        run: |
          python -m venv /tmp/sdist-env
          PY=/tmp/sdist-env/bin/python; [ -x "$PY" ] || PY=/tmp/sdist-env/Scripts/python.exe
          "$PY" -m pip install dist/*.tar.gz
          python tools/smoke_ui.py "$PY"

  # One check that sums up the whole matrix, so branch rules can require a single status ("CI passed")
  # instead of fifteen job names that change whenever the matrix does.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, lint, package]
    runs-on: ubuntu-latest
    steps:
      - name: Every test job and the lint job succeeded
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
