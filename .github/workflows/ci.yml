name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: with uvloop/winloop
        if: matrix.os != 'windows-latest' || matrix.python != '3.15'
        run: |
          python -m pip install -e ".[fast]" || echo "fast extras unavailable on this Python yet"
          python -m pytest -q tests/test_api.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests tools

  # One check that sums up the whole matrix, so branch rules can require a single status ("CI passed")
  # instead of fifteen job names that change whenever the matrix does.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Every test job and the lint job succeeded
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
