name: Docs

# Pull requests: build strictly and check links, anchors and API references.
# Pushes to main: the same, plus the release gate (no placeholders), then deploy to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,parquet]" -r docs/requirements.txt pandas
      - name: Test the docs (examples, generated references, simulator)
        run: python -m pytest -q tests/test_docs.py
      - name: Build (strict)
        run: zensical build --clean
      - name: Check links, anchors and third-party requests
        run: python tools/check_docs.py
      - name: Release gate (no placeholders)
        if: github.event_name == 'push'
        run: python tools/check_docs.py --release
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
