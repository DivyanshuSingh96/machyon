name: Announce release on Discord

# Posts a published release's title and notes to the Machyon Community #announcements channel.
# It's separate from publish.yml on purpose: a Discord problem can never block or fail a PyPI release.
# One-time setup: create a webhook for #announcements in Discord and save its URL as the repository secret
# DISCORD_RELEASE_WEBHOOK (Settings -> Secrets and variables -> Actions). Without the secret, this does nothing.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: discord-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  announce:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/discord-release.jq
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        # The release text is read from the event file by jq, never pasted into this script.
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::The DISCORD_RELEASE_WEBHOOK secret isn't set, so nothing was posted to Discord."
            exit 0
          fi
          jq -f .github/discord-release.jq "$GITHUB_EVENT_PATH" > message.json
          if ! curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
               -H "Content-Type: application/json" --data-binary @message.json \
               -o response.json "$WEBHOOK?wait=true"; then
            echo "::error::Discord didn't accept the message. Its answer:"; cat response.json 2>/dev/null; echo
            exit 1
          fi
          echo "Posted to Discord as message $(jq -r '.id' response.json)."
