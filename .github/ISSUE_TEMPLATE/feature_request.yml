name: Feature request
description: An idea that would make Machyon more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Code sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds or other tools, if any.
