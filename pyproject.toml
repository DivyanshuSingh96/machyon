[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "machyon"
version = "1.1.0"
description = "Fast async image downloads for Python, with every file accounted for."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divyanshu Singh" }]
keywords = [
    "image downloader", "bulk download", "dataset", "machine learning", "asyncio", "aiohttp",
    "web scraping", "crawler", "computer vision", "data collection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10",
    "tqdm>=4.66",
    "truststore>=0.10",   # verify HTTPS with the OS trust store, like browsers do
    "certifi>=2024.2.2",  # fallback CA bundle
]

[project.optional-dependencies]
# ~17% more throughput when CPU-bound; brotli for servers that answer with Content-Encoding: br
fast = [
    "uvloop>=0.21; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
    "winloop>=0.1; sys_platform == 'win32'",
    "brotli>=1.1",
]
parquet = ["pyarrow>=15"]
all = ["machyon[fast,parquet]"]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2"]

[project.scripts]
machyon = "machyon.cli:main"

[project.urls]
Homepage = "https://github.com/DivyanshuSingh96/machyon"
Documentation = "https://divyanshusingh96.github.io/machyon/"
Repository = "https://github.com/DivyanshuSingh96/machyon"
Issues = "https://github.com/DivyanshuSingh96/machyon/issues"
Changelog = "https://github.com/DivyanshuSingh96/machyon/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/machyon"]

[tool.hatch.build.targets.sdist]
include = ["/src/machyon", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B008", "E501"]
