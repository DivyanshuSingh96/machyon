{#- The theme's search button as a field: what it searches, and the shortcut as a key (Ctrl K, or ⌘ K on a Mac, from
    the theme's data-platform; drawn by machyon.css). The theme's own script opens search on either. -#}
<div class="md-search" data-md-component="search" role="dialog" aria-label="{{ lang.t('search') }}">
  <button type="button" class="md-search__button" aria-keyshortcuts="Control+K Meta+K" data-mx-item="search">
    <span class="mx-search__label" data-mx-label>Search docs</span>
  </button>
</div>
